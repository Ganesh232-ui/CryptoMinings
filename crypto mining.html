<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https:;">
<title>CRYPTO MINING PLATFORM</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"
  integrity="sha384-jb8JQMbMoBUzgWatfe6COACi2ljcDdZQ2OxczGA3bGNeWe+6DChMTBJemed7ZnvJ"
  crossorigin="anonymous"></script>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0a0f1c;
  color: white;
}

header {
  text-align: center;
  padding: 20px;
  font-size: 24px;
  background: linear-gradient(90deg,#f7931a,#ffcc00);
  color: black;
}

.container {
  padding: 20px;
}

.card {
  background: #111827;
  padding: 20px;
  margin: 15px 0;
  border-radius: 10px;
}

button {
  padding: 10px;
  border: none;
  background: #f7931a;
  cursor: pointer;
  width: 100%;
}

</style>
</head>

<body>

<header>⚡ CRYPTO MINING PLATFORM</header>

<div class="container">

<div class="card">
<h3>Wallet</h3>
<button onclick="connectWallet()">Connect MetaMask</button>
<p id="wallet"></p>
</div>

<div class="card">
<h3>Deposit BTC</h3>
<p>Send BTC to:</p>
<small id="deposit-address"></small>
<button onclick="checkDeposit()">Check Deposit</button>
</div>

<div class="card">
<h3>Balance</h3>
<p id="balance">0 BTC</p>
</div>

<div class="card">
<h3>Mining</h3>
<button onclick="startMining()">Start Mining</button>
<p id="mining"></p>
</div>

</div>

<script>
const API_BASE_URL = window.location.origin;
let userWallet = "";

function isValidEthAddress(address) {
  return /^0x[a-fA-F0-9]{40}$/.test(address);
}

function sanitizeText(str) {
  const div = document.createElement("div");
  div.appendChild(document.createTextNode(str));
  return div.innerHTML;
}

async function connectWallet() {
  try {
    if (typeof window.ethereum === "undefined") {
      document.getElementById("wallet").innerText = "MetaMask not detected.";
      return;
    }

    const acc = await window.ethereum.request({ method: 'eth_requestAccounts' });
    const wallet = acc[0];

    if (!isValidEthAddress(wallet)) {
      document.getElementById("wallet").innerText = "Invalid wallet address.";
      return;
    }

    userWallet = wallet;
    document.getElementById("wallet").innerText = sanitizeText(userWallet);

    const res = await fetch(API_BASE_URL + "/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "same-origin",
      body: JSON.stringify({ wallet: userWallet })
    });

    if (!res.ok) {
      console.error("Registration failed:", res.status);
    }
  } catch (err) {
    console.error("Wallet connection error:", err.message);
    document.getElementById("wallet").innerText = "Connection failed. Try again.";
  }
}

async function checkDeposit() {
  try {
    if (!userWallet || !isValidEthAddress(userWallet)) {
      document.getElementById("balance").innerText = "Connect wallet first.";
      return;
    }

    const res = await fetch(API_BASE_URL + "/balance/" + encodeURIComponent(userWallet), {
      credentials: "same-origin"
    });

    if (!res.ok) {
      document.getElementById("balance").innerText = "Error fetching balance.";
      return;
    }

    const data = await res.json();

    const balance = parseFloat(data.balance);
    if (isNaN(balance) || balance < 0) {
      document.getElementById("balance").innerText = "Invalid balance data.";
      return;
    }

    document.getElementById("balance").innerText = balance.toFixed(8) + " BTC";
  } catch (err) {
    console.error("Balance check error:", err.message);
    document.getElementById("balance").innerText = "Error fetching balance.";
  }
}

function startMining() {
  let earn = 0;
  setInterval(() => {
    earn += Math.random() * 0.00001;
    document.getElementById("mining").innerText = earn.toFixed(6) + " BTC";
  }, 2000);
}

(function init() {
  const depositAddr = "bc1plvp5kr53rmg2vs0j4vzk8zjnpakwneuwytuz4c3nn0fg28n6lfkqs0zgry";
  document.getElementById("deposit-address").innerText = depositAddr;
})();
</script>

</body>
</html>
