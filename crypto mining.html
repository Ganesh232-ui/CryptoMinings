<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CRYPTO MINING PLATFORM</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0a0f1c;
  color: white;
}

header {
  text-align: center;
  padding: 20px;
  font-size: 24px;
  background: linear-gradient(90deg,#f7931a,#ffcc00);
  color: black;
}

.container {
  padding: 20px;
}

.card {
  background: #111827;
  padding: 20px;
  margin: 15px 0;
  border-radius: 10px;
}

button {
  padding: 10px;
  border: none;
  background: #f7931a;
  cursor: pointer;
  width: 100%;
}

</style>
</head>

<body>

<header>⚡ CRYPTO MINING PLATFORM</header>

<div class="container">

<div class="card">
<h3>Wallet</h3>
<button onclick="connectWallet()">Connect MetaMask</button>
<p id="wallet"></p>
</div>

<div class="card">
<h3>Deposit BTC</h3>
<p>Send BTC to:</p>
<small>bc1plvp5kr53rmg2vs0j4vzk8zjnpakwneuwytuz4c3nn0fg28n6lfkqs0zgry</small>
<button onclick="checkDeposit()">Check Deposit</button>
</div>

<div class="card">
<h3>Balance</h3>
<p id="balance">0 BTC</p>
</div>

<div class="card">
<h3>Mining</h3>
<button onclick="startMining()">Start Mining</button>
<p id="mining"></p>
</div>

</div>

<script>
const API = "http://localhost:3000";
let userWallet = "";
let miningInterval = null;

async function connectWallet() {
  if (typeof window.ethereum === "undefined") {
    alert("MetaMask is not installed. Please install MetaMask to connect your wallet.");
    return;
  }

  try {
    const acc = await ethereum.request({ method: 'eth_requestAccounts' });
    if (!acc || acc.length === 0) {
      alert("No accounts found. Please unlock MetaMask and try again.");
      return;
    }
    userWallet = acc[0];
    document.getElementById("wallet").innerText = userWallet;
  } catch (err) {
    if (err.code === 4001) {
      alert("Connection rejected. Please approve the MetaMask request to continue.");
    } else {
      alert("Failed to connect wallet: " + err.message);
    }
    console.error("connectWallet error:", err);
    return;
  }

  try {
    const res = await fetch(API + "/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ wallet: userWallet })
    });
    if (!res.ok) {
      throw new Error("Server responded with status " + res.status);
    }
  } catch (err) {
    alert("Failed to register wallet with server: " + err.message);
    console.error("register error:", err);
  }
}

async function checkDeposit() {
  if (!userWallet) {
    alert("Please connect your wallet first.");
    return;
  }

  try {
    const res = await fetch(API + "/balance/" + userWallet);
    if (!res.ok) {
      throw new Error("Server responded with status " + res.status);
    }
    const data = await res.json();
    if (data.balance === undefined || data.balance === null) {
      throw new Error("Invalid balance data received from server.");
    }
    document.getElementById("balance").innerText = data.balance + " BTC";
  } catch (err) {
    alert("Failed to check deposit: " + err.message);
    console.error("checkDeposit error:", err);
  }
}

function startMining() {
  if (miningInterval !== null) {
    alert("Mining is already running.");
    return;
  }

  let earn = 0;
  miningInterval = setInterval(() => {
    earn += Math.random() * 0.00001;
    document.getElementById("mining").innerText = earn.toFixed(6) + " BTC mined";
  }, 2000);
  document.getElementById("mining").innerText = "Mining started...";
}
</script>

</body>
</html>
