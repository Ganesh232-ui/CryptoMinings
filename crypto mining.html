<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CRYPTO MINING PLATFORM</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0a0f1c;
  color: white;
}

header {
  text-align: center;
  padding: 20px;
  font-size: 24px;
  background: linear-gradient(90deg,#f7931a,#ffcc00);
  color: black;
}

.container {
  padding: 20px;
}

.card {
  background: #111827;
  padding: 20px;
  margin: 15px 0;
  border-radius: 10px;
}

button {
  padding: 10px;
  border: none;
  background: #f7931a;
  cursor: pointer;
  width: 100%;
}

</style>
</head>

<body>

<header>⚡ CRYPTO MINING PLATFORM</header>

<div class="container">

<div class="card">
<h3>Wallet</h3>
<button onclick="onConnectWallet()">Connect MetaMask</button>
<p id="wallet"></p>
</div>

<div class="card">
<h3>Deposit BTC</h3>
<p>Send BTC to:</p>
<small>bc1plvp5kr53rmg2vs0j4vzk8zjnpakwneuwytuz4c3nn0fg28n6lfkqs0zgry</small>
<button onclick="onCheckDeposit()">Check Deposit</button>
</div>

<div class="card">
<h3>Balance</h3>
<p id="balance">0 BTC</p>
</div>

<div class="card">
<h3>Mining</h3>
<button onclick="onStartMining()">Start Mining</button>
<p id="mining"></p>
</div>

</div>

<script src="src/wallet.js"></script>
<script src="src/balance.js"></script>
<script src="src/mining.js"></script>
<script>
const API = "http://localhost:3000";
let userWallet = "";
let miningSession = null;

async function onConnectWallet() {
  userWallet = await connectWallet(ethereum, fetch.bind(window), API);
  document.getElementById("wallet").innerText = userWallet;
}

async function onCheckDeposit() {
  const balance = await checkDeposit(userWallet, fetch.bind(window), API);
  document.getElementById("balance").innerText = balance + " BTC";
}

function onStartMining() {
  if (miningSession && miningSession.isRunning()) return;
  miningSession = createMiningSession();
  miningSession.start(function(earnings) {
    document.getElementById("mining").innerText = formatBTC(earnings);
  }, 2000);
}
</script>

</body>
</html>
